<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="t d" font-family="Noto Sans JP, sans-serif">
  <title id="t">締切の境界と、判定に使う時刻</title>
  <desc id="d">上段：締切時刻 closes_at を境にした半開区間。closes_at の1マイクロ秒前までは受付中、ちょうどの時刻からは締切後。下段：リクエストが締切前に届いても、行ロックの待ちで処理が締切後になることがある。ロックを取る前に読んだ時刻で判定すると、締切後の書き込みを受理してしまう。ロックを取った後に読んだ時刻で判定すると、拒否できる。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8099"/>
    </marker>
  </defs>
  <g font-size="14" fill="#7a8099">
    <!-- 上段 -->
    <text x="20" y="28" font-size="16" font-weight="700">① 締切は半開区間：closes_at ちょうどから「締切後」</text>
    <rect x="40" y="70" width="420" height="34" fill="#14b8a633" stroke="#14b8a6" stroke-width="2"/>
    <rect x="460" y="70" width="460" height="34" fill="#ff6d3a33" stroke="#ff6d3a" stroke-width="2"/>
    <text x="250" y="93" text-anchor="middle">受付中（now &lt; closes_at）</text>
    <text x="690" y="93" text-anchor="middle">締切後（now ≥ closes_at）→ 409 POLL_CLOSED</text>
    <line x1="460" y1="56" x2="460" y2="122" stroke="#ff6d3a" stroke-width="3"/>
    <text x="460" y="48" text-anchor="middle" font-weight="700">closes_at</text>
    <!-- 3つの時刻 -->
    <circle cx="430" cy="140" r="6" fill="#14b8a6"/>
    <text x="430" y="166" text-anchor="middle">closes_at の 1µs 前</text>
    <text x="430" y="186" text-anchor="middle" fill="#14b8a6" font-weight="700">受理</text>
    <circle cx="460" cy="140" r="6" fill="#ff6d3a"/>
    <text x="600" y="150" text-anchor="middle">closes_at ちょうど</text>
    <path d="M520,146 L470,140" stroke="#7a8099" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
    <text x="600" y="170" text-anchor="middle" fill="#ff6d3a" font-weight="700">拒否</text>
    <circle cx="800" cy="140" r="6" fill="#ff6d3a"/>
    <text x="800" y="166" text-anchor="middle">1日後</text>
    <text x="800" y="186" text-anchor="middle" fill="#ff6d3a" font-weight="700">拒否</text>
    <text x="40" y="216" font-size="13">Java：Poll.isClosedAt(now) = !now.isBefore(closesAt)（手動で締めた投票は status = CLOSED で常に締切後）</text>

    <line x1="20" y1="236" x2="940" y2="236" stroke="#7a8099" stroke-opacity="0.4"/>

    <!-- 下段 -->
    <text x="20" y="264" font-size="16" font-weight="700">② 判定に使う時刻：届いた時刻ではなく、ロックを取った後の時刻</text>
    <line x1="40" y1="380" x2="930" y2="380" stroke="#7a8099" stroke-width="2" marker-end="url(#arr)"/>
    <text x="930" y="402" text-anchor="end" font-size="13">時間</text>
    <!-- 締切 -->
    <line x1="520" y1="292" x2="520" y2="392" stroke="#ff6d3a" stroke-width="3"/>
    <text x="520" y="284" text-anchor="middle" font-weight="700" fill="#ff6d3a">締切</text>
    <!-- 他の処理がロックを持つ -->
    <rect x="130" y="302" width="500" height="26" fill="#7a809933" stroke="#7a8099"/>
    <text x="380" y="321" text-anchor="middle" font-size="13">別の処理が polls の行をロック中（FOR UPDATE）</text>
    <!-- 届いた -->
    <circle cx="260" cy="380" r="6" fill="#14b8a6"/>
    <text x="260" y="424" text-anchor="middle" font-size="13">投票が届く</text>
    <text x="260" y="442" text-anchor="middle" font-size="13">（締切の前）</text>
    <!-- ロック待ち -->
    <rect x="260" y="342" width="370" height="22" fill="none" stroke="#7a8099" stroke-dasharray="5 4"/>
    <text x="445" y="358" text-anchor="middle" font-size="13">ロックの待ち</text>
    <!-- ロック取得 -->
    <circle cx="630" cy="380" r="6" fill="#ff6d3a"/>
    <text x="680" y="424" text-anchor="middle" font-size="13">ロックを取って書き込む</text>
    <text x="680" y="442" text-anchor="middle" font-size="13">（締切の後）</text>
    <text x="685" y="304" font-size="13" fill="#ff6d3a" font-weight="700">先に読んだ時刻 → 受理（誤り）</text>
    <text x="685" y="326" font-size="13" fill="#14b8a6" font-weight="700">取った後に読んだ時刻 → 拒否（正しい）</text>
  </g>
</svg>
