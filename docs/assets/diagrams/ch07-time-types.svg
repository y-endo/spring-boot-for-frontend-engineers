<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d" font-family="Noto Sans JP, sans-serif">
  <title id="t">LocalDateTimeとInstantの違い</title>
  <desc id="d">LocalDateTimeの「11月8日23時30分」は、サーバーのタイムゾーンがJSTなら協定世界時の14時30分、UTCなら23時30分という別の瞬間になる。Instantは1つの瞬間を指し、地域ごとの時計表示は変換結果である。</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6d3a"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14b8a6"/>
    </marker>
  </defs>

  <!-- LocalDateTime -->
  <rect x="20" y="20" width="330" height="86" rx="12" fill="#ff6d3a22" stroke="#ff6d3a" stroke-width="2"/>
  <text x="185" y="50" text-anchor="middle" font-size="16" font-weight="700" fill="#ff6d3a">LocalDateTime</text>
  <text x="185" y="76" text-anchor="middle" font-size="16" fill="#ff6d3a">2026-11-08T23:30</text>
  <text x="185" y="96" text-anchor="middle" font-size="14" fill="#ff6d3a">壁時計の読み。どこの時計かは不明</text>

  <!-- 2本の矢印 -->
  <path d="M120,106 L120,196 L225,196" fill="none" stroke="#ff6d3a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="130" y="150" font-size="14" fill="#ff6d3a">サーバーが JST なら</text>
  <path d="M290,106 L700,186" fill="none" stroke="#ff6d3a" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="420" y="130" font-size="14" fill="#ff6d3a">サーバーが UTC なら</text>

  <!-- UTC 軸 -->
  <line x1="40" y1="230" x2="920" y2="230" stroke="#7a8099" stroke-width="2"/>
  <text x="20" y="262" font-size="14" fill="#7a8099">UTC の時刻軸（Instant はこの軸上の 1 点）</text>
  <g font-size="14" fill="#7a8099" text-anchor="middle">
    <line x1="80"  y1="224" x2="80"  y2="236" stroke="#7a8099" stroke-width="2"/><text x="80"  y="218">12:00</text>
    <line x1="260" y1="224" x2="260" y2="236" stroke="#7a8099" stroke-width="2"/><text x="260" y="218">14:00</text>
    <line x1="440" y1="224" x2="440" y2="236" stroke="#7a8099" stroke-width="2"/><text x="440" y="218">16:00</text>
    <line x1="620" y1="224" x2="620" y2="236" stroke="#7a8099" stroke-width="2"/><text x="620" y="218">18:00</text>
    <line x1="800" y1="224" x2="800" y2="236" stroke="#7a8099" stroke-width="2"/><text x="800" y="218">20:00</text>
  </g>
  <text x="915" y="218" text-anchor="end" font-size="14" fill="#7a8099">… 23:30 は枠の外（右へ続く）</text>

  <!-- 14:30Z の点 -->
  <circle cx="305" cy="230" r="9" fill="#ff6d3a"/>
  <text x="305" y="286" text-anchor="middle" font-size="15" font-weight="700" fill="#ff6d3a">2026-11-08T14:30:00Z</text>
  <text x="305" y="306" text-anchor="middle" font-size="14" fill="#ff6d3a">JST の 23:30 はここ</text>

  <!-- 23:30Z の点（枠外） -->
  <circle cx="900" cy="230" r="9" fill="#ff6d3a" fill-opacity="0.45"/>
  <text x="900" y="286" text-anchor="end" font-size="15" font-weight="700" fill="#ff6d3a">2026-11-08T23:30:00Z</text>
  <text x="900" y="306" text-anchor="end" font-size="14" fill="#ff6d3a">UTC の 23:30 は 9 時間後</text>

  <!-- 同じ瞬間の見え方 -->
  <rect x="20" y="340" width="920" height="84" rx="12" fill="#14b8a622" stroke="#14b8a6" stroke-width="2"/>
  <text x="40" y="368" font-size="16" font-weight="700" fill="#14b8a6">同じ 1 つの Instant（14:30Z）を、地域の時計で見ると</text>
  <text x="40" y="396" font-size="15" fill="#14b8a6">Asia/Tokyo  23:30 (+09:00)　　　UTC  14:30　　　America/New_York  09:30 (-05:00)</text>
  <line x1="305" y1="240" x2="305" y2="338" stroke="#14b8a6" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#g)"/>
</svg>
