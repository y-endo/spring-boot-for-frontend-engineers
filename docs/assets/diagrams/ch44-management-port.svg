<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Noto Sans JP, sans-serif" font-size="15">
  <title>本番のポート構成：利用者は 8080 だけ、管理ポート 9090 は内側</title>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8099"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#14b8a6"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6d3a"/>
    </marker>
  </defs>

  <!-- 外側 -->
  <rect x="20" y="20" width="200" height="380" rx="10" fill="#7a809914" stroke="#7a8099" stroke-width="1.5"/>
  <text x="120" y="48" text-anchor="middle" font-weight="bold" fill="#7a8099">外（インターネット）</text>
  <rect x="40" y="90" width="160" height="60" rx="8" fill="#ff6d3a22" stroke="#ff6d3a" stroke-width="1.5"/>
  <text x="120" y="126" text-anchor="middle" fill="#7a8099">利用者のブラウザ</text>
  <rect x="40" y="250" width="160" height="60" rx="8" fill="#ff6d3a22" stroke="#ff6d3a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="120" y="278" text-anchor="middle" fill="#7a8099">誰か（攻撃者）</text>
  <text x="120" y="298" text-anchor="middle" font-size="14" fill="#7a8099">9090 を探す</text>

  <!-- コンテナ -->
  <rect x="300" y="20" width="360" height="380" rx="10" fill="#14b8a60f" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="480" y="48" text-anchor="middle" font-weight="bold" fill="#14b8a6">アプリのコンテナ</text>
  <rect x="320" y="76" width="320" height="110" rx="8" fill="#ff6d3a22" stroke="#ff6d3a" stroke-width="2"/>
  <text x="480" y="104" text-anchor="middle" font-weight="bold" fill="#ff6d3a">ポート 8080（利用者向け）</text>
  <text x="480" y="130" text-anchor="middle" fill="#7a8099">/api/**　静的クライアント</text>
  <text x="480" y="154" text-anchor="middle" fill="#7a8099">/actuator/** は存在しない（401）</text>
  <rect x="320" y="230" width="320" height="140" rx="8" fill="#14b8a622" stroke="#14b8a6" stroke-width="2"/>
  <text x="480" y="258" text-anchor="middle" font-weight="bold" fill="#14b8a6">ポート 9090（管理）</text>
  <text x="480" y="284" text-anchor="middle" fill="#7a8099">/actuator/health/readiness</text>
  <text x="480" y="306" text-anchor="middle" fill="#7a8099">/actuator/health/liveness</text>
  <text x="480" y="328" text-anchor="middle" fill="#7a8099">/actuator/metrics</text>
  <text x="480" y="354" text-anchor="middle" font-size="14" fill="#7a8099">compose の ports に書かない</text>

  <!-- 内側の利用者 -->
  <rect x="740" y="230" width="200" height="60" rx="8" fill="#14b8a622" stroke="#14b8a6" stroke-width="1.5"/>
  <text x="840" y="258" text-anchor="middle" fill="#7a8099">監視・ヘルスチェック</text>
  <text x="840" y="278" text-anchor="middle" font-size="14" fill="#7a8099">同じネットワークの内側</text>
  <text x="840" y="326" text-anchor="middle" font-size="14" fill="#7a8099">例：コンテナ内の curl、</text>
  <text x="840" y="346" text-anchor="middle" font-size="14" fill="#7a8099">監視用のコンテナ</text>

  <!-- 矢印 -->
  <line x1="200" y1="120" x2="318" y2="120" stroke="#ff6d3a" stroke-width="2" marker-end="url(#a3)"/>
  <line x1="200" y1="280" x2="318" y2="280" stroke="#7a8099" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="258" y="272" text-anchor="middle" font-size="26" font-weight="bold" fill="#ff6d3a">×</text>
  <line x1="738" y1="260" x2="642" y2="260" stroke="#14b8a6" stroke-width="2" marker-end="url(#a2)"/>
</svg>
