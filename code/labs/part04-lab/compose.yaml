# 第4部の実験用 PostgreSQL 18。
# - ホスト側ポートは LAB_DB_PORT（既定 25420）。Windows で 5432 が別の PostgreSQL に使われていても衝突しない。
# - log_statement=all: サーバーが受け取った SQL をすべてログに出す。
#   Spring が実際に BEGIN / COMMIT / ROLLBACK を送っていることを、サーバー側のログで確かめるために使う。
# - 資格情報は実験用の使い捨て。
name: part04-lab
services:
  pg:
    image: 'postgres:18-alpine'
    container_name: part04-lab-pg
    command: ['postgres', '-c', 'log_statement=all', '-c', 'log_line_prefix=%m [%p] ']
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - '${LAB_DB_PORT:-25420}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lab -d lab']
      interval: 3s
      timeout: 3s
      retries: 20
