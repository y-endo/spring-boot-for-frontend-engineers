# 第37章の実験用 PostgreSQL 18（ホスト側 25437）。終わったら docker compose down -v で必ず止める。
name: ch37-lab
services:
  pg:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - '25437:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lab -d lab']
      interval: 3s
      timeout: 3s
      retries: 20
