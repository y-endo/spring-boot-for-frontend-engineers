# 第29章の実験用 PostgreSQL 18。リファレンス実装（code/quickvote）の jar をこの DB に向けて動かす。
# - ホスト側ポートは LAB_DB_PORT（既定 25429）。
# - 資格情報は実験用の使い捨て。
name: ch29-scheduling
services:
  pg:
    image: 'postgres:18-alpine'
    container_name: ch29-scheduling-pg
    environment:
      POSTGRES_DB: quickvote
      POSTGRES_USER: quickvote
      POSTGRES_PASSWORD: quickvote
    ports:
      - '${LAB_DB_PORT:-25429}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quickvote -d quickvote']
      interval: 3s
      timeout: 3s
      retries: 20
