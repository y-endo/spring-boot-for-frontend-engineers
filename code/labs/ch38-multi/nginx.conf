# 第38章: app×2 の前に置くリバースプロキシ。
# SSE を通す設定（proxy_buffering off など）を、バッファありの設定と並べて観察できるようにしてある。

# どのアプリに振り分けたかをログに出す（app1 / app2 の IP が upstream= に出る）
log_format up '$request  -> $upstream_addr  ($status)';
access_log /dev/stdout up;

upstream quickvote {
    # 既定は順番に振り分ける（ラウンドロビン）。同じ人のリクエストでも、台が替わる。
    server app1:8080;
    server app2:8080;
}

upstream first_only {
    server app1:8080;
}

server {
    listen 80;

    # SSE 用: 応答をためずに、すぐクライアントへ流す。
    location ~ ^/api/polls/[^/]+/events$ {
        proxy_pass http://quickvote;
        proxy_http_version 1.1;          # keep-alive／チャンク転送に必要（既定は 1.0）
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;             # これが肝。off にしないと、イベントがバッファにたまって届かない
        proxy_cache off;
        proxy_read_timeout 1h;           # 既定は60秒。無通信がこれを超えると切られる（ハートビートは15秒おき）
    }

    # 比較用: proxy_read_timeout を nginx の既定値(60秒)のままにした SSE。app1 だけに流す。
    # アプリのハートビートが60秒より長いと、無通信とみなされて nginx に切られる。
    location /default-timeout/ {
        rewrite ^/default-timeout/(.*)$ /$1 break;
        proxy_pass http://first_only;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        # proxy_read_timeout は書かない（既定の 60s）
    }

    location / {
        proxy_pass http://quickvote;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
