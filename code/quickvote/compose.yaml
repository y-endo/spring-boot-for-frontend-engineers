# 開発用の PostgreSQL。./mvnw spring-boot:run で Spring Boot が自動で起動する（spring-boot-docker-compose）。
# 手動で起動するなら: docker compose up -d
# ホスト側のポートは 15432 にしている（Windows では 5432 が別の PostgreSQL に使われていることが多いため）。
# Spring Boot は公開されたポートを自動で読み取るので、アプリ側の設定は要らない。
# 資格情報は開発用の使い捨てで、本番では使わない。
services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      POSTGRES_DB: quickvote
      POSTGRES_USER: quickvote
      POSTGRES_PASSWORD: quickvote
    ports:
      - '15432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U quickvote -d quickvote']
      interval: 5s
      timeout: 3s
      retries: 10
